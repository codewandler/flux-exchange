[package]
name = "codewandler-flux-exchange-host"
description = "The flux-exchange host, as ports: identity, runtimes, grants and leases. Composable into a product's own binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crate keeps its bare identity in import paths; only the crates.io package name carries the
# vanity prefix, matching the rest of the flux family.
[lib]
name = "exchange_host"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
connector-address.workspace = true
connector-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `connector-pack` and the flux engine are here rather than in `[dependencies]` on purpose (X-11).
#
# Nothing in this crate executes an operation yet — X-12 is what gives it a reason to *ship* the
# pack. This crate is the published artifact, so a normal dependency would put the whole flux
# engine into the graph of every consumer of `codewandler-flux-exchange-host` today, to satisfy a
# proof rather than to run any code. A dev-dependency is absent from a published crate's
# requirements, so it costs consumers nothing and still compiles under `cargo test --workspace`,
# which is where the proof has to hold. X-12 promotes these three lines into `[dependencies]`.
[dev-dependencies]
connector-pack.workspace = true
flux-runtime.workspace = true
flux-web.workspace = true
