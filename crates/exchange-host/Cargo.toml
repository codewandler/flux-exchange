[package]
name = "codewandler-flux-exchange-host"
description = "The flux-exchange host, as ports: identity, runtimes, grants and leases. Composable into a product's own binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crate keeps its bare identity in import paths; only the crates.io package name carries the
# vanity prefix, matching the rest of the flux family.
[lib]
name = "exchange_host"
path = "src/lib.rs"

# **This table is an allow-list, and `tests/no_second_request_path.rs` reads it** (X-12, lock 1).
#
# The whole invoke path lives in this crate, and the property that makes it safe is negative: there
# is no transport here to build a second request with. A deny-list would only catch the HTTP clients
# somebody thought of, so the test asserts this table is a **subset** of a list written in the test
# with a reason beside every entry. Adding a dependency here means writing that reason down.
#
# `connector-pack` and `flux-runtime` were `[dev-dependencies]` until X-12 (see X-11's argument),
# and promoting them is a deliberate decision about the published artifact's weight: every consumer
# of `codewandler-flux-exchange-host` now carries the flux engine, because this crate now *runs*
# operations rather than merely proving it could link the thing that does.
#
# `flux-web` deliberately did **not** come with them. It is where `HttpRequestTool` lives, and lock 1
# says the crate that dispatches holds no transport: the transport arrives as an `Egress`, and
# `exchange-server` is the only crate that names `flux_web`.
[dependencies]
async-trait.workspace = true
connector-address.workspace = true
connector-catalog.workspace = true
connector-pack.workspace = true
connector-secrets.workspace = true
flux-core.workspace = true
flux-flow.workspace = true
flux-lang.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Platform owner and no-follow filesystem inspection for Exchange's non-credential durable stores.
# It is an OS ABI wrapper with no transport or network IO.
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# Native ownership and DACL inspection/creation only. This is the OS ABI vocabulary for the
# owner-only local-state boundary; it contains no transport and performs no network IO.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Not checked by the allow-list, and that is the point of the split: a dev-dependency is absent from
# a published crate's requirements, so nothing here reaches a consumer's graph. `flux-web` stays
# here for `tests/engine_line.rs`, which links `HttpRequestTool` against the pack on purpose, and
# `flux-system` is here because building a `flux_runtime::ToolContext` needs a `System` — which is
# exactly why a composition supplies the context through a port rather than this crate minting one.
[dev-dependencies]
flux-system.workspace = true
flux-tools.workspace = true
flux-web.workspace = true
tokio.workspace = true
