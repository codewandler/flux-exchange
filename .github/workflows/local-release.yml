# Publishes the separately versioned local Exchange executable. This does not publish crates or a
# Flux/plugin artifact. The stable channel is exposed only after the immutable release is public,
# provenance-verified and byte-for-byte reverified through the one-redirect client transport.
name: local Exchange release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flux-exchange-stable-channel
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_SOURCE: ${{ github.sha }}

jobs:
  # This is deliberately before native builds. X-126 does not create trust material. Until the
  # independently reviewed public root policy is committed and both exact role secrets are
  # configured, a tag fails here without creating an artifact or draft release.
  preflight:
    name: delegated signer and offline-root preflight
    runs-on: ubuntu-24.04
    environment: local-release
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
      build_id: ${{ steps.identity.outputs.build_id }}
      channel_key_id: ${{ steps.delegation.outputs.channel_key_id }}
      release_key_id: ${{ steps.delegation.outputs.release_key_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Refuse an unpublished or incomplete tagged tree before secrets or tools
        run: |
          ./scripts/check-publication-readiness.sh --self-test
          ./scripts/check-publication-readiness.sh

      - name: Refuse absent production trust inputs and bind the immutable tag
        id: identity
        shell: bash
        env:
          FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 }}
          FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag must be vX.Y.Z"; exit 1 ;;
          esac
          version="${RELEASE_TAG#v}"
          printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          workspace_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          [ "$version" = "$workspace_version" ] || { echo "::error::tag does not match workspace version"; exit 1; }
          source="$(git rev-parse HEAD)"
          [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$source" ] || { echo "::error::checkout does not match immutable tag"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" ] || { echo "::error::release dispatch must run from the immutable tag ref so provenance names that tag"; exit 1; }
          [ "$GITHUB_SHA" = "$source" ] || { echo "::error::workflow provenance SHA does not match the immutable tag commit"; exit 1; }
          [ -s .github/release-root-policy.json ] || { echo "::error::.github/release-root-policy.json is absent; commit independently reviewed offline-root public policy before release"; exit 1; }
          [ -n "$FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64" ] || { echo "::error::FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 is not configured"; exit 1; }
          [ -n "$FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64" ] || { echo "::error::FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 is not configured"; exit 1; }
          printf '%s' "$FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'
          printf '%s' "$FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'
          build_id="github-${GITHUB_REPOSITORY_ID}-${source}"
          echo "source=$source" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build_id=$build_id" >>"$GITHUB_OUTPUT"

      - name: Install release-verifier toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Download current root-signed trust metadata through the client transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir trust
          scripts/release-download.sh exchange-trust-v1 flux-exchange-release-trust.json trust/flux-exchange-release-trust.json
          jq -er '.root_signing_key_ids[]' trust/flux-exchange-release-trust.json | while IFS= read -r key_id; do
            scripts/release-download.sh exchange-trust-v1 "flux-exchange-release-trust.json.${key_id}.minisig" "trust/flux-exchange-release-trust.json.${key_id}.minisig"
          done

      - name: Prove both secret-derived keys have distinct current delegated roles
        id: delegation
        shell: bash
        env:
          FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 }}
          FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cargo run --locked -p flux-exchange-release -- verify-trust trust \
            --root-policy .github/release-root-policy.json --now "$now" \
            --require-secret channel:FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 \
            --require-secret release:FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 >delegation.json
          [ "$(jq '.channel_key_ids | length' delegation.json)" = 1 ]
          [ "$(jq '.release_key_ids | length' delegation.json)" = 1 ]
          channel_key_id="$(jq -er '.channel_key_ids[0]' delegation.json)"
          release_key_id="$(jq -er '.release_key_ids[0]' delegation.json)"
          [ "$channel_key_id" != "$release_key_id" ]
          echo "channel_key_id=$channel_key_id" >>"$GITHUB_OUTPUT"
          echo "release_key_id=$release_key_id" >>"$GITHUB_OUTPUT"

  # The release path proves the complete tagged tree; a neighbouring PR/main run is not evidence
  # about an arbitrary tag. This mirrors the repository gate instead of trusting run chronology.
  gate:
    name: full tagged repository gate
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt

      - name: Cargo gate
        run: |
          ./scripts/check-action-pins.sh --self-test
          ./scripts/check-action-pins.sh
          ./scripts/check-repository-security.sh --self-test
          ./scripts/check-repository-security.sh
          ./scripts/check-crate-versions.sh --self-test
          ./scripts/check-crate-versions.sh
          ./scripts/check-current-version.sh --self-test
          ./scripts/check-current-version.sh
          ./scripts/check-local-release.sh --self-test
          ./scripts/check-local-release.sh
          ./scripts/release-check-assets.sh --self-test
          ./scripts/release-native-fixtures.sh --self-test
          ./scripts/release-download.sh --self-test
          ./scripts/release-validate-redirect.py --self-test
          cargo build --workspace --locked
          cargo test --workspace --locked
          ./scripts/check-dev-signin.sh
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check

      - name: Build on the declared MSRV
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          [ -n "$msrv" ]
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --workspace --locked

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            web/package-lock.json

      - name: Console and public-site gates
        run: |
          (cd console && npm ci && npm audit --audit-level=high && npm test && npm run build)
          (cd web && npm ci && npm audit --audit-level=high && npm run build && npm test)

  build:
    name: native release · ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Prove native storage, restart, readiness ABI and supervisor death
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release-download.sh --self-test
          ./scripts/release-native-fixtures.sh --self-test
          cargo test -p codewandler-flux-exchange-host --locked private_fs
          cargo test -p flux-exchange --bin flux-exchange --locked local_state
          ./scripts/release-native-fixtures.sh '${{ matrix.target }}'
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -File ./scripts/check-windows-state-refusals.ps1
          fi
          ./scripts/check-dev-signin.sh

      - name: Build identified server and verify exact compatibility identity
        shell: bash
        env:
          FLUX_EXCHANGE_RELEASE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source }}
          FLUX_EXCHANGE_RELEASE_BUILD_ID: ${{ needs.preflight.outputs.build_id }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p flux-exchange --target '${{ matrix.target }}'
          suffix=''
          [ "$RUNNER_OS" != Windows ] || suffix='.exe'
          executable="target/${{ matrix.target }}/release/flux-exchange${suffix}"
          python3 - "$RELEASE_TAG" '${{ needs.preflight.outputs.version }}' \
            '${{ needs.preflight.outputs.source }}' '${{ needs.preflight.outputs.build_id }}' \
            >compatibility-entry.json <<'PY'
          import json
          import sys

          tag, version, source_commit, build_id = sys.argv[1:]
          entry = {
              "tag": f"refs/tags/{tag}",
              "version": version,
              "source_commit": source_commit,
              "build_id": build_id,
              # These fields are outside the compatibility command. Their closed production values
              # are generated only after every native archive has reached the publish job.
              "manifest_sha256": "0" * 64,
              "release_key_ids": ["pre-manifest-native-verification"],
              "protocols": {
                  "exchange_api": "exchange.api.v1",
                  "effective_catalogue_response": "exchange.effective-catalogue-response.v1",
                  "invoke_request": "exchange.invoke-request.v1",
                  "invoke_response": "exchange.invoke-response.v1",
                  "connection_plan": "exchange.connection-plan.v2",
                  "local_management": "exchange.local-management.v1",
                  "service_account_handoff": "exchange.service-account-handoff.v1",
                  "supervisor": "exchange.supervisor-ready.v2",
              },
          }
          print(json.dumps(entry, ensure_ascii=False, separators=(",", ":"), sort_keys=True))
          PY
          executable_sha256="$(python3 - "$executable" <<'PY'
          import hashlib
          import sys

          digest = hashlib.sha256()
          with open(sys.argv[1], "rb") as executable:
              for chunk in iter(lambda: executable.read(1024 * 1024), b""):
                  digest.update(chunk)
          print(digest.hexdigest())
          PY
          )"
          cargo run --locked -p flux-exchange-release -- verify-compatibility \
            --executable "$executable" --entry compatibility-entry.json \
            --executable-sha256 "$executable_sha256"
          scripts/release-package.sh '${{ needs.preflight.outputs.version }}' '${{ matrix.target }}' "$executable" dist

      - name: Upload one native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exchange-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attest, expose immutable release, then advance stable
    runs-on: ubuntu-24.04
    needs: [gate, preflight, build]
    environment: local-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 }}
      FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64: ${{ secrets.FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install release toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Download the exact five native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: exchange-*
          path: packages
          merge-multiple: true

      - name: Re-prove delegation, generate and sign canonical manifest, verify closed staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir trust staged release channel-current channel-next
          scripts/release-download.sh exchange-trust-v1 flux-exchange-release-trust.json trust/flux-exchange-release-trust.json
          jq -er '.root_signing_key_ids[]' trust/flux-exchange-release-trust.json | while IFS= read -r key_id; do
            scripts/release-download.sh exchange-trust-v1 "flux-exchange-release-trust.json.${key_id}.minisig" "trust/flux-exchange-release-trust.json.${key_id}.minisig"
          done
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cargo run --locked -p flux-exchange-release -- verify-trust trust \
            --root-policy .github/release-root-policy.json --now "$now" \
            --require-secret channel:FLUX_EXCHANGE_CHANNEL_SIGNING_KEY_B64 \
            --require-secret release:FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64
          existing=-
          if gh release view exchange-stable-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            scripts/release-download.sh exchange-stable-v1 flux-exchange-release-channel.json channel-current/flux-exchange-release-channel.json
            jq -er '.signing_key_ids[]' channel-current/flux-exchange-release-channel.json | while IFS= read -r key_id; do
              scripts/release-download.sh exchange-stable-v1 "flux-exchange-release-channel.json.${key_id}.minisig" "channel-current/flux-exchange-release-channel.json.${key_id}.minisig"
            done
            cp trust/* channel-current/
            cargo run --locked -p flux-exchange-release -- verify-channel channel-current \
              --root-policy .github/release-root-policy.json --now "$now"
            existing=channel-current/flux-exchange-release-channel.json
          fi
          cp packages/*.tar.zst packages/*.zip release/
          scripts/release-stage.sh packages '${{ needs.preflight.outputs.version }}' \
            '${{ needs.preflight.outputs.source }}' '${{ needs.preflight.outputs.build_id }}' \
            '${{ needs.preflight.outputs.release_key_id }}' release/flux-exchange-release-manifest.json
          cargo run --locked -p flux-exchange-release -- sign release/flux-exchange-release-manifest.json \
            --secret-key-env FLUX_EXCHANGE_RELEASE_SIGNING_KEY_B64 --role release \
            --trust-directory trust --root-policy .github/release-root-policy.json --now "$now" \
            --output-directory release
          issued_at="$now"
          expires_at="$(python3 - "$issued_at" <<'PY'
          import datetime
          import sys
          issued = datetime.datetime.strptime(sys.argv[1], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
          print((issued + datetime.timedelta(seconds=604799)).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )"
          scripts/release-channel.sh "$existing" release/flux-exchange-release-manifest.json \
            '${{ needs.preflight.outputs.release_key_id }}' '${{ needs.preflight.outputs.channel_key_id }}' \
            "$issued_at" "$expires_at" channel-next trust .github/release-root-policy.json "$now"
          cp trust/* channel-next/* release/* staged/
          cargo run --locked -p flux-exchange-release -- verify-staged staged \
            --root-policy .github/release-root-policy.json --now "$now"

      - name: Record repository and workflow provenance before exposure
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # Trust bytes came from the external offline-root process. Attest only what this workflow
          # built or signed; root signatures remain the authority for the copied trust snapshot.
          subject-path: |
            release/*
            channel-next/*

      - name: Create or resume the immutable draft and expose only the verified closed set
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          release_was_public=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets >release-state.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release-state.json)" = false ]; then
              release_was_public=true
              actual="$(jq -r '.assets[].name' release-state.json | LC_ALL=C sort)"
              [ "$actual" = "$expected" ] || { echo '::error::public immutable release asset set disagrees'; diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); exit 1; }
              mkdir existing
              while IFS= read -r asset; do
                [ -z "$asset" ] || scripts/release-download.sh "$RELEASE_TAG" "$asset" "existing/$asset"
              done <<<"$expected"
              diff -rq release existing
              for artifact in existing/*; do
                gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
                  --source-digest '${{ needs.preflight.outputs.source }}' --source-ref "refs/tags/$RELEASE_TAG" \
                  --signer-workflow codewandler/flux-exchange/.github/workflows/local-release.yml \
                  --deny-self-hosted-runners
              done
            else
              actual="$(jq -r '.assets[].name' release-state.json | LC_ALL=C sort)"
              while IFS= read -r asset; do
                [ -z "$asset" ] || printf '%s\n' "$expected" | grep -Fxq "$asset" || { echo "::error::private immutable draft contains undeclared asset $asset"; exit 1; }
              done <<<"$actual"
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if printf '%s\n' "$actual" | grep -Fxq "$asset"; then
                  local_size="$(wc -c <"release/$asset")"
                  local_digest="sha256:$(sha256sum "release/$asset" | awk '{print $1}')"
                  remote_size="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size' release-state.json)"
                  remote_digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' release-state.json)"
                  [ "$remote_size" = "$local_size" ] && [ "$remote_digest" = "$local_digest" ] || { echo "::error::private immutable draft asset $asset disagrees"; exit 1; }
                else
                  gh release upload "$RELEASE_TAG" "release/$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done <<<"$expected"
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target '${{ needs.preflight.outputs.source }}' \
              --title "Flux Exchange ${{ needs.preflight.outputs.version }}" --notes-file /dev/null --draft
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release upload "$RELEASE_TAG" "release/$asset" --repo "$GITHUB_REPOSITORY"
            done <<<"$expected"
          fi
          actual="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] || { echo '::error::draft release asset set is not closed'; diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); exit 1; }
          if [ "$release_was_public" = false ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

      - name: Re-download immutable assets through one 302 and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir live
          find release -maxdepth 1 -type f -printf '%f\n' | while IFS= read -r asset; do
            scripts/release-download.sh "$RELEASE_TAG" "$asset" "live/$asset"
          done
          diff -rq release live
          for artifact in live/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --source-digest '${{ needs.preflight.outputs.source }}' --source-ref "refs/tags/$RELEASE_TAG" \
              --signer-workflow codewandler/flux-exchange/.github/workflows/local-release.yml \
              --deny-self-hosted-runners
          done

      - name: Publish or resume immutable stable-generation evidence
        shell: bash
        run: |
          set -euo pipefail
          generation="$(jq -er '.generation' channel-next/flux-exchange-release-channel.json)"
          history_tag="exchange-stable-v1-generation-${generation}"
          mkdir channel-history
          cp trust/* channel-next/* channel-history/
          expected="$(find channel-history -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          history_was_public=false

          if gh release view "$history_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets >history-state.json 2>/dev/null; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${history_tag}" --jq '[.object.type,.object.sha] | @tsv')"
            [ "$tag_object" = $'commit\t${{ needs.preflight.outputs.source }}' ] || { echo '::error::stable-history tag target disagrees with its release source'; exit 1; }
            if [ "$(jq -r '.isDraft' history-state.json)" = false ]; then
              history_was_public=true
            else
              actual="$(jq -r '.assets[].name' history-state.json | LC_ALL=C sort)"
              while IFS= read -r asset; do
                [ -z "$asset" ] || printf '%s\n' "$expected" | grep -Fxq "$asset" || { echo "::error::private stable-history draft contains undeclared asset $asset"; exit 1; }
              done <<<"$actual"
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if printf '%s\n' "$actual" | grep -Fxq "$asset"; then
                  local_size="$(wc -c <"channel-history/$asset")"
                  local_digest="sha256:$(sha256sum "channel-history/$asset" | awk '{print $1}')"
                  remote_size="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size' history-state.json)"
                  remote_digest="$(jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' history-state.json)"
                  [ "$remote_size" = "$local_size" ] && [ "$remote_digest" = "$local_digest" ] || { echo "::error::private stable-history asset $asset disagrees"; exit 1; }
                else
                  gh release upload "$history_tag" "channel-history/$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done <<<"$expected"
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${history_tag}" >/dev/null 2>&1; then
              echo '::error::stable-history tag exists without its immutable release; refusing recreation'
              exit 1
            fi
            gh release create "$history_tag" --repo "$GITHUB_REPOSITORY" --target '${{ needs.preflight.outputs.source }}' \
              --title "Flux Exchange stable generation ${generation}" \
              --notes 'Immutable trust/channel audit snapshot; exchange-stable-v1 remains the mutable discovery head.' \
              --draft --latest=false
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release upload "$history_tag" "channel-history/$asset" --repo "$GITHUB_REPOSITORY"
            done <<<"$expected"
          fi

          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${history_tag}" --jq '[.object.type,.object.sha] | @tsv')"
          [ "$tag_object" = $'commit\t${{ needs.preflight.outputs.source }}' ] || { echo '::error::stable-history tag target disagrees with its release source'; exit 1; }

          if [ "$history_was_public" = false ]; then
            actual="$(gh release view "$history_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
            [ "$actual" = "$expected" ] || { echo '::error::private stable-history asset set is not closed'; exit 1; }
            gh release edit "$history_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

          # The public archive, not authenticated API state, is the evidence boundary. Derive its
          # closed signature set from the two authenticated documents and use only bounded transport.
          mkdir channel-history-live
          scripts/release-download.sh "$history_tag" flux-exchange-release-trust.json channel-history-live/flux-exchange-release-trust.json
          scripts/release-download.sh "$history_tag" flux-exchange-release-channel.json channel-history-live/flux-exchange-release-channel.json
          [ "$(jq -er '.generation' channel-history-live/flux-exchange-release-channel.json)" = "$generation" ]
          jq -er '.root_signing_key_ids[]' channel-history-live/flux-exchange-release-trust.json | while IFS= read -r key_id; do
            scripts/release-download.sh "$history_tag" "flux-exchange-release-trust.json.${key_id}.minisig" "channel-history-live/flux-exchange-release-trust.json.${key_id}.minisig"
          done
          jq -er '.signing_key_ids[]' channel-history-live/flux-exchange-release-channel.json | while IFS= read -r key_id; do
            scripts/release-download.sh "$history_tag" "flux-exchange-release-channel.json.${key_id}.minisig" "channel-history-live/flux-exchange-release-channel.json.${key_id}.minisig"
          done
          actual="$(gh release view "$history_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          downloaded="$(find channel-history-live -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          [ "$actual" = "$downloaded" ] || { echo '::error::public stable-history asset set is not closed'; exit 1; }
          diff -rq channel-history channel-history-live
          diff -q channel-next/flux-exchange-release-channel.json channel-history-live/flux-exchange-release-channel.json
          for signature in channel-next/*.minisig; do
            diff -q "$signature" "channel-history-live/${signature#channel-next/}"
          done
          # Historical signatures are audited at their signed issuance point; expiry governs new
          # client starts, not whether retained public evidence remains cryptographically reviewable.
          now="$(jq -er '.issued_at' channel-history-live/flux-exchange-release-channel.json)"
          cargo run --locked -p flux-exchange-release -- verify-channel channel-history-live \
            --root-policy .github/release-root-policy.json --now "$now"
          for artifact in channel-history-live/flux-exchange-release-channel.json*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --source-digest '${{ needs.preflight.outputs.source }}' --source-ref "refs/tags/$RELEASE_TAG" \
              --signer-workflow codewandler/flux-exchange/.github/workflows/local-release.yml \
              --deny-self-hosted-runners
          done

      - name: Expose the already-verified stable signatures before its canonical index
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view exchange-stable-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create exchange-stable-v1 --repo "$GITHUB_REPOSITORY" --target '${{ needs.preflight.outputs.source }}' \
              --title 'Flux Exchange stable channel' --notes 'Signed mutable stable-channel transport; release identities remain immutable.'
          fi
          for signature in channel-next/*.minisig; do
            gh release upload exchange-stable-v1 "$signature" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release upload exchange-stable-v1 channel-next/flux-exchange-release-channel.json --repo "$GITHUB_REPOSITORY" --clobber
          expected="$(find channel-next -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual="$(gh release view exchange-stable-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          while IFS= read -r asset; do
            [ -z "$asset" ] || printf '%s\n' "$expected" | grep -Fxq "$asset" || \
              gh release delete-asset exchange-stable-v1 "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done <<<"$actual"
          actual="$(gh release view exchange-stable-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] || { echo '::error::stable channel asset set is not closed'; exit 1; }

      - name: Verify public trust, stable selection, immutable release and host compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          cp live/* published/
          scripts/release-download.sh exchange-trust-v1 flux-exchange-release-trust.json published/flux-exchange-release-trust.json
          jq -er '.root_signing_key_ids[]' published/flux-exchange-release-trust.json | while IFS= read -r key_id; do
            scripts/release-download.sh exchange-trust-v1 "flux-exchange-release-trust.json.${key_id}.minisig" "published/flux-exchange-release-trust.json.${key_id}.minisig"
          done
          scripts/release-download.sh exchange-stable-v1 flux-exchange-release-channel.json published/flux-exchange-release-channel.json
          jq -er '.signing_key_ids[]' published/flux-exchange-release-channel.json | while IFS= read -r key_id; do
            scripts/release-download.sh exchange-stable-v1 "flux-exchange-release-channel.json.${key_id}.minisig" "published/flux-exchange-release-channel.json.${key_id}.minisig"
          done
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cargo run --locked -p flux-exchange-release -- verify-published published \
            --root-policy .github/release-root-policy.json --now "$now" --target x86_64-unknown-linux-gnu
