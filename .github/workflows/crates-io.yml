# Publishes this workspace's crates.io artifact when a version tag `vX.Y.Z` is pushed.
#
# Modelled on ../flux-connectors' workflow of the same name, with one deliberate simplification:
# this workspace publishes **one** crate, `codewandler-flux-exchange-host`. There is no closure to
# order, so there is no topological sort — `flux-exchange` itself is `publish = false` (it is one
# composition of the host, and a product embedding the host writes its own binary).
#
# REQUIRED SECRET: `CARGO_REGISTRY_TOKEN` — the org-level secret on `codewandler`. It has SELECTED
# visibility, so this repository must be on its allow-list:
#   Settings → Secrets and variables → Actions → CARGO_REGISTRY_TOKEN → Repository access.
# Without it this job fails fast, before a toolchain is installed or anything is packaged.
#
# THE GATE RUNS HERE, AND STILL DOES NOW THAT `ci.yml` EXISTS. `ci.yml` gates every push to `main`
# and every pull request, which is what catches a red tree when it lands — but it is not evidence
# about *this* commit. A tag can be pushed at a commit no CI run ever covered: a branch that was
# never merged, a run cancelled by the next push, a fork, a window where Actions were disabled.
# Deferring would mean trusting a run that may not exist, and publishing an artifact nobody tested is
# the worst possible thing to make permanent, because the upload cannot be withdrawn. So the gate is
# part of this job rather than assumed from a neighbouring one, and duplicating four cheap commands
# on the one irreversible path is the correct trade. Keep it. See X-28.
#
# Idempotent: a crate@version already on crates.io is skipped, so a failed run can be re-run, or the
# tag re-pushed, to resume. That matters because a published version cannot be withdrawn.
#
# Publishing is CI-only by contract — see AGENTS.md § Publishing contract. Do not run
# `cargo publish` by hand.
name: crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Resume a publish that died partway (a crates.io rate limit, a network failure) from the current
  # branch. Idempotent, so it skips what is already live.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate proves the frozen fixture against its earlier candidate commit without a
          # network fetch, so retain the history that contains that immutable object.
          fetch-depth: 0

      - name: Refuse an unpublished or incomplete tagged tree before tokens or tools
        run: |
          ./scripts/check-publication-readiness.sh --self-test
          ./scripts/check-publication-readiness.sh

      # First, before a toolchain is installed or anything is packaged: a missing secret must stop
      # the run here, not surface as an upload failure after the artifact is already live.
      - name: Check the publish token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. It is an org-level secret on codewandler with SELECTED visibility — add this repository under Settings → Secrets and variables → Actions → CARGO_REGISTRY_TOKEN → Repository access."
            exit 1
          fi

      - name: Install Rust toolchain
        # The same pin as ../flux and ../flux-connectors, so a release built here is built by the
        # cargo the rest of the family releases with. Note this is NOT the workspace's
        # `rust-version` — that is the MSRV a consumer must have, not the toolchain we ship from.
        # The number is deliberately not restated here; `ci.yml`'s `msrv` job reads it out of
        # `Cargo.toml` and proves the workspace still builds on it.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt

      - name: Verify the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wsver=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag workspace=$wsver"
          if [ "$tag" != "$wsver" ]; then
            echo "::error::tag v$tag does not match [workspace.package].version $wsver"
            exit 1
          fi

      - name: Verify current prose matches the workspace version
        run: |
          ./scripts/check-current-version.sh --self-test
          ./scripts/check-current-version.sh

      # The project's gate, exactly as AGENTS.md § Build / test / run states it. A red gate must
      # stop the publish, because the upload cannot be taken back afterwards.
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Development command browser round trip
        run: ./scripts/check-dev-signin.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates-io.sh
