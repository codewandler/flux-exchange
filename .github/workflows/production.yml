# Production is built from one immutable commit on protected main. The workflow reruns the whole
# repository gate because a deploy is evidence about this checkout, not a claim inherited from a
# different run. The production environment owns the app-scoped Fly deploy token; no pull_request
# event reaches this file or its secret.
name: production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA already reachable from protected main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  source:
    name: select immutable source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Require a full commit on protected main
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_sha must be one full lowercase commit SHA'
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_SHA^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/main; then
            echo '::error::source_sha is not reachable from protected main'
            exit 1
          fi
          echo "sha=$REQUESTED_SHA" >>"$GITHUB_OUTPUT"

  gate:
    name: complete repository gate
    needs: source
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            web/package-lock.json

      - name: Locked Rust gate
        run: |
          cargo fetch --locked
          cargo build --workspace --locked
          cargo test --workspace --locked
          ./scripts/check-dev-signin.sh
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check

      - name: Build on the declared MSRV
        run: |
          set -euo pipefail
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" build --workspace --locked

      - name: Console gate
        working-directory: console
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Public site gate
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

      - name: Repository contracts
        run: |
          ./scripts/check-action-pins.sh --self-test
          ./scripts/check-action-pins.sh
          ./scripts/check-repository-security.sh --self-test
          ./scripts/check-repository-security.sh
          ./scripts/check-crate-versions.sh --self-test
          ./scripts/check-crate-versions.sh
          ./scripts/check-current-version.sh --self-test
          ./scripts/check-current-version.sh
          ./scripts/check-production-operations.sh --self-test
          ./scripts/check-production-operations.sh
          ./scripts/verify-production-config.sh --self-test

      - name: Install cargo-audit 0.22.0
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit locked Rust dependencies
        # RSA key generation is unreachable: this service only verifies provider public keys.
        # ttf-parser is an unfixed unmaintained warning in flux-web's PDF reader, not a vulnerability.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0192

  deploy:
    name: scan and deploy production
    needs: [source, gate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://flux-exchange.fly.dev
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: flux-exchange
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-08-03

      - name: Require the app-scoped deploy token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo '::error::production FLY_API_TOKEN is absent; use an app-scoped Fly deploy token'
            exit 1
          fi

      - name: Require the deployed operator policy
        run: ./scripts/verify-production-config.sh

      - name: Build exactly the selected checkout
        id: image
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          test -n "$version"
          image="registry.fly.io/${FLY_APP}:source-${SOURCE_SHA}"
          docker build \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --tag "$image" .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_SHA"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Emit SPDX SBOM for the built image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: production.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Refuse every known image vulnerability
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image.outputs.image }}
          fail-build: true
          severity-cutoff: negligible
          output-format: json
          output-file: production-vulnerabilities.json
          config: .grype.yaml

      - name: Summarize a refused image without hiding the finding
        if: ${{ failure() && steps.scan.outcome == 'failure' }}
        run: |
          set -euo pipefail
          test -s production-vulnerabilities.json
          jq -r '.matches[] |
            [.vulnerability.id, .vulnerability.severity, .artifact.name, .artifact.version,
             ((.vulnerability.fix.versions // []) | join(","))] | @tsv' \
            production-vulnerabilities.json | sort -u

      - name: Retain refused scan evidence
        if: ${{ failure() && steps.scan.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-scan-failure-${{ env.SOURCE_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: |
            production.spdx.json
            production-vulnerabilities.json

      - name: Push the scanned image and resolve its immutable digest
        id: pushed
        run: |
          set -euo pipefail
          flyctl auth docker
          docker push "${{ steps.image.outputs.image }}" | tee production-push.log
          digest="$(sed -nE 's/^.*digest:[[:space:]]*(sha256:[0-9a-f]{64}).*$/\1/p' production-push.log | tail -n1)"
          case "$digest" in
            sha256:*) ;;
            *) echo '::error::registry did not return an immutable image digest'; exit 1 ;;
          esac
          echo "ref=registry.fly.io/${FLY_APP}@${digest}" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          sha256sum production.spdx.json >production.spdx.json.sha256

      - name: Deploy, verify and visibly roll back on failure
        env:
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          EVIDENCE_FILE: production-evidence.json
        run: |
          set -euo pipefail
          machines="$(flyctl machines list --app "$FLY_APP" --json)"
          previous_ref="$(jq -r '[.[] | select(.state == "started")][0].image_ref |
            (.registry + "/" + .repository + "@" + .digest)' <<<"$machines")"
          case "$previous_ref" in
            registry.fly.io/${FLY_APP}@sha256:*) ;;
            *) echo '::error::could not resolve the previous production image digest'; exit 1 ;;
          esac
          rollback() {
            echo "::error::production verification failed; redeploying the previous immutable image"
            flyctl deploy --app "$FLY_APP" --image "$previous_ref" --ha=false --strategy immediate --yes
          }
          if ! flyctl deploy --app "$FLY_APP" --image "${{ steps.pushed.outputs.ref }}" \
            --ha=false --strategy immediate --yes; then
            rollback
            exit 1
          fi
          if ! ./scripts/verify-production-release.sh; then
            rollback
            exit 1
          fi
          sbom_sha="$(sha256sum production.spdx.json | cut -d' ' -f1)"
          scan_sha="$(sha256sum production-vulnerabilities.json | cut -d' ' -f1)"
          jq --arg sbom_sha256 "$sbom_sha" --arg vulnerability_scan_sha256 "$scan_sha" \
            '. + {sbom_sha256: $sbom_sha256, vulnerability_scan_sha256: $vulnerability_scan_sha256}' \
            production-evidence.json >production-evidence.tmp
          mv production-evidence.tmp production-evidence.json

      - name: Upload source, image, release and scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: |
            production-evidence.json
            production.spdx.json
            production.spdx.json.sha256
            production-vulnerabilities.json
