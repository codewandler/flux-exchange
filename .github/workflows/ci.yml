# The gate, on every push to `main` and every pull request.
#
# Until this file existed, `crates-io.yml` — which fires only on a `vX.Y.Z` tag — was the only
# workflow in the repository. So a red `main` stayed invisible until someone tried to cut a release,
# and `console/` was never built by CI at all: its suite, including the guard on the components
# carried from flux-connectors, ran only when a person remembered.
#
# Modelled on ../flux-connectors/.github/workflows/ci.yml — same job shape, same action pins, same
# caching. Where this one differs, the difference is commented where it occurs.
#
# THIS DOES NOT REPLACE THE GATE IN `crates-io.yml`, and that gate must not be deleted on the
# grounds that this file now exists. A tag can be pushed at a commit this workflow never ran on: a
# branch that was never merged, a run that was cancelled, a fork, a repository whose Actions were
# disabled for an afternoon. A publish cannot be withdrawn, so the release path proves the gate for
# itself rather than inheriting a claim from a run that may not exist. Both gates stay.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Every job here only reads the checkout: nothing comments on a pull request,
# uploads an artifact, or touches a package. `crates-io.yml` declares the same `contents: read` and
# needs no more either — its registry credential is a secret, not a workflow permission.
permissions:
  contents: read

# Keep the queue short, so the gate stays fast enough that people do not learn to ignore it.
# Cancellation is deliberately scoped to pull requests: on `main` every commit keeps its own run,
# because a commit whose run was cancelled by the next push is exactly the commit someone later tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  check:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # The same pin `crates-io.yml` carries, and the same one ../flux and ../flux-connectors
        # release with, so a green run here and a green release build are the same cargo.
        #
        # This is NOT the workspace's `rust-version`. That is the MSRV a consumer must have; this is
        # the toolchain we build with. Two numbers for two reasons — see AGENTS.md. The `msrv` job
        # below covers the other one, and reads it out of `Cargo.toml` rather than restating it here.
        #
        # Pinned rather than `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally. To
        # bump it, change it here and in `crates-io.yml` together, run clippy and fmt locally on that
        # same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit; the toolchain the tag used to encode
          # is an explicit — and, at this SHA, required — input.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `--locked` here, not on the four gate steps below: it makes a stale or hand-edited
      # `Cargo.lock` an obvious, named failure rather than something cargo silently repairs, while
      # the gate commands stay byte-identical to the ones in AGENTS.md § Build / test / run.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Development command browser round trip
        run: ./scripts/check-dev-signin.sh

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  msrv:
    name: the workspace builds on the Rust version it promises
    runs-on: ubuntu-latest
    # X-33. `Cargo.toml` tells every consumer the oldest Rust that works here, and until this job
    # existed nothing checked whether that was true. It was not: `rust-version = "1.87"` shipped in
    # v0.1.0, v0.2.0 and v0.3.0, while `jsonwebtoken`, `time`, `time-core` and `time-macros` each
    # declare 1.88.0 — so cargo refused before compiling a line, and had done since X-04 brought
    # `jsonwebtoken` in. A promise nobody checks is a promise that is already false and nobody knows.
    #
    # THE NUMBER IS NOT WRITTEN HERE. It is read out of `Cargo.toml` and fed to the toolchain
    # installer, because a job with the version hardcoded is a fourth place holding one number —
    # exactly the shape X-27 and X-30 just finished removing from this repository. There is one
    # `rust-version`, and this job builds on whatever it currently says.
    #
    # WHEN THIS GOES RED, THE FIX IS A DECISION, NOT AN EDIT. Raising `rust-version` to match
    # whatever a new dependency demands makes the job green again while silently breaking every
    # consumer still on the old toolchain — that is a compatibility break and it belongs in the
    # CHANGELOG. It is also, precisely, what happened in X-30: the number was corrected to 1.88 after
    # the fact, to match a reality it had been wrong about for three releases. That was the repair,
    # not the pattern. If the MSRV is ever raised again it should be because this job went red and
    # someone decided to raise it.
    #
    # `cargo build --workspace --locked` and nothing else. This answers "does this compile for a
    # consumer on the oldest toolchain we claim", not "are the tests green" — the `check` job above
    # already owns the gate, and duplicating it here would double the cost of every pull request to
    # re-prove something.
    permissions:
      contents: read # restates the workflow default, so the job is readable on its own
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The whole trick: the toolchain installer takes a version string, so the manifest becomes the
      # input. `head -n1` because `[workspace.package]` declares it once and the member crates
      # inherit with `rust-version.workspace = true`; an empty result is a broken parse, not a
      # missing MSRV, so it fails loudly rather than silently installing something arbitrary.
      - name: Read the MSRV out of Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "could not read rust-version from Cargo.toml — the parse is broken, or the manifest is" >&2
            exit 1
          fi
          echo "MSRV declared in Cargo.toml: $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install the declared MSRV toolchain
        # Same action and same pin as `check` above. No `components`: this job neither lints nor
        # formats, and clippy's output on an old toolchain is not something we act on.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        # Keyed by toolchain version, so this gets its own entry rather than fighting `check` for one.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `--locked`: a consumer builds the dependency versions we committed. Letting cargo resolve
      # something newer here would test a tree nobody ships, and a dependency that has raised its own
      # `rust-version` is exactly the failure this job is watching for.
      - name: Build on the declared MSRV
        run: cargo build --workspace --locked

  native-local-state:
    name: local state · ${{ matrix.target }}
    # Platform support is the real credential-bearing composition, not a cross-compiled health
    # handler. Each row runs on its target architecture and exercises the shared logical formats,
    # the native owner-only filesystem binding and the real --dev process restart.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain for the native target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: local-state-${{ matrix.target }}

      - name: Compile the complete server and local composition
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

      - name: Exercise native owner-only storage fixtures
        run: cargo test -p codewandler-flux-exchange-host --locked private_fs

      - name: Exercise zero-configuration state selection
        run: cargo test -p flux-exchange --bin flux-exchange --locked local_state

      - name: Exercise the native Unix supervisor ABI and owner-death path
        if: runner.os != 'Windows'
        run: cargo test -p flux-exchange --test supervised_unix --features supervisor-test-wedge,supervisor-test-bind-refusal --locked --target ${{ matrix.target }}

      - name: Exercise the native Windows supervisor ABI and owner-death path
        if: runner.os == 'Windows'
        run: cargo test -p flux-exchange --test supervised_windows --features supervisor-test-wedge,supervisor-test-bind-refusal --locked --target ${{ matrix.target }}

      - name: Exercise native Windows capability-kind and direction validation
        if: runner.os == 'Windows'
        run: cargo test -p flux-exchange --lib --features supervisor-test-wedge,supervisor-test-bind-refusal --locked --target ${{ matrix.target }} supervisor::tests::windows_validator_refuses_noninherited_nonpipe_and_each_wrong_direction

      - name: Refuse unsafe Windows stores through the real startup composition
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-state-refusals.ps1

      - name: Restart the real development composition over durable state
        shell: bash
        run: ./scripts/check-dev-signin.sh

  console:
    name: console · audit · test · build
    runs-on: ubuntu-latest
    # Its own job rather than a step bolted onto `check`. `console/` is a separate Node build that
    # does not participate in the Cargo workspace (AGENTS.md § Build / test / run): it needs Node and
    # not a Rust toolchain, it caches a different tree, and a failure here should fail under its own
    # name instead of inside the Rust gate. It is also the reason the two jobs run in parallel — a
    # broken console does not wait on a cargo build to say so.
    #
    # Until this job existed nothing outside a developer's machine ran `console/test/`, which
    # includes `components.test.mjs` — the guard that the 15 components shared with flux-connectors
    # import only Vue, a sibling component and `catalog.mts`. AGENTS.md § The console states that as
    # an invariant enforced by a test; nothing was running the test.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node
        # Pinned for the same reason the Rust toolchain above is, and at the version and SHA
        # ../flux-connectors carries — a moving version turns someone else's release into our red
        # build. (Written without the literal step keyword so a "grep for an unpinned action" scan,
        # like ../flux's `check-action-pins.sh`, cannot match this comment.)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # `npm ci`, not the `npm install` of AGENTS.md's dev loop: `ci` installs exactly the committed
      # lockfile and fails when it and `package.json` disagree, instead of quietly resolving
      # something else. That is what makes the tree CI tests the tree the lockfile describes, and it
      # is the same choice — for the same reason — as both Node jobs in ../flux-connectors' ci.yml.
      - name: Install dependencies
        run: npm ci
        working-directory: console

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: console

      # Order is AGENTS.md's: test, then build. Unlike ../flux-connectors' `web` job — whose suite
      # asserts against the *rendered* site and so must run after the build — these tests read
      # `console/src` only and never `console/dist`, so they do not depend on a build having
      # happened. Verified on 2026-08-01 at 9ec774d: 18 tests across three files, green from a clean
      # `npm ci` with no `dist/` present.
      - name: Test
        run: npm test
        working-directory: console

      # A real gate, not a formality: `npm run build` is `vue-tsc --noEmit && vite build`, so it
      # type-checks every component and `.mts` module before bundling them.
      - name: Build
        run: npm run build
        working-directory: console

  dependency-audit:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-audit 0.22.0
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit locked dependencies
        # RUSTSEC-2023-0071 affects RSA key generation. This service generates no RSA keys: its
        # jsonwebtoken path parses provider public keys and verifies id-token signatures.
        # RUSTSEC-2026-0192 marks ttf-parser unmaintained rather than vulnerable; it is transitive
        # through flux-web's PDF reader and has no maintained release to update to today. Denying
        # every other warning keeps each exception narrow and visible here.
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0192

  action-pins:
    name: third-party actions are pinned to a commit SHA
    runs-on: ubuntu-latest
    # X-30. AGENTS.md and both workflows treat SHA pinning as an invariant, and until this job existed
    # nothing failed when someone wrote `uses: foo/bar@v3` — it was enforced by review, which is to
    # say by whoever happened to look. That matters most for `crates-io.yml`, which holds
    # `CARGO_REGISTRY_TOKEN`: a movable tag there hands an upstream maintainer publish rights to a
    # crate whose versions cannot be withdrawn.
    #
    # Following ../flux's job of the same name, including the part that is easy to drop: the checker
    # runs `--self-test` FIRST. A scanner that has not just demonstrated it catches an unpinned
    # reference is not evidence that there are none — a silently mis-parsing grep reports a clean
    # tree exactly as loudly as a working one.
    #
    # Costs a checkout and a few seconds; no toolchain, no cache, no build.
    permissions:
      contents: read # restates the workflow default, so the job is readable on its own
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every third-party action names a full commit SHA
        run: |
          ./scripts/check-action-pins.sh --self-test
          ./scripts/check-action-pins.sh

      - name: Security reporting and dependency-update policy stay complete
        # Live controls are verified after mutation through GitHub's read-only API. This checks the
        # committed half without an administration token, inside an already-required context so an
        # older open branch is not stranded by a check name it cannot emit.
        run: |
          ./scripts/check-repository-security.sh --self-test
          ./scripts/check-repository-security.sh

  crate-versions:
    name: workspace, host pin and current prose versions agree
    runs-on: ubuntu-latest
    # X-30. `Cargo.toml` states this workspace's version twice — `[workspace.package].version` and the
    # `version` on the `exchange-host` entry in `[workspace.dependencies]` — and the `path` half of
    # that entry is what builds locally, so nothing here notices when they drift. They meet for the
    # first time at `cargo publish`, which strips the path and ships the version requirement to
    # crates.io. AGENTS.md § Publishing contract says to move them together; this is what makes that a
    # machine's job.
    #
    # This does NOT replace `crates-io.yml`'s tag-vs-version check, and that one must stay: it
    # compares the pushed tag against the manifest and can only run at release, and a tag can be
    # pushed at a commit no pull request ever touched. This one catches the mismatch a week earlier,
    # where the fix is free.
    #
    # X-81 extends the same rule to the five exact prose lines that claim to describe the current
    # build. Its scanner deliberately ignores historical release headings and milestone citations;
    # those versions remain true and rewriting them would destroy history rather than prevent drift.
    permissions:
      contents: read # restates the workflow default, so the job is readable on its own
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: One current version is one number
        run: |
          ./scripts/check-crate-versions.sh --self-test
          ./scripts/check-crate-versions.sh
          ./scripts/check-current-version.sh --self-test
          ./scripts/check-current-version.sh
