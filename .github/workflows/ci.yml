# The gate, on every push to `main` and every pull request.
#
# Until this file existed, `crates-io.yml` — which fires only on a `vX.Y.Z` tag — was the only
# workflow in the repository. So a red `main` stayed invisible until someone tried to cut a release,
# and `console/` was never built by CI at all: its suite, including the guard on the components
# carried from flux-connectors, ran only when a person remembered.
#
# Modelled on ../flux-connectors/.github/workflows/ci.yml — same job shape, same action pins, same
# caching. Where this one differs, the difference is commented where it occurs.
#
# THIS DOES NOT REPLACE THE GATE IN `crates-io.yml`, and that gate must not be deleted on the
# grounds that this file now exists. A tag can be pushed at a commit this workflow never ran on: a
# branch that was never merged, a run that was cancelled, a fork, a repository whose Actions were
# disabled for an afternoon. A publish cannot be withdrawn, so the release path proves the gate for
# itself rather than inheriting a claim from a run that may not exist. Both gates stay.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Every job here only reads the checkout: nothing comments on a pull request,
# uploads an artifact, or touches a package. `crates-io.yml` declares the same `contents: read` and
# needs no more either — its registry credential is a secret, not a workflow permission.
permissions:
  contents: read

# Keep the queue short, so the gate stays fast enough that people do not learn to ignore it.
# Cancellation is deliberately scoped to pull requests: on `main` every commit keeps its own run,
# because a commit whose run was cancelled by the next push is exactly the commit someone later tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  check:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # The same pin `crates-io.yml` carries, and the same one ../flux and ../flux-connectors
        # release with, so a green run here and a green release build are the same cargo.
        #
        # This is NOT the workspace's `rust-version` (1.87). That is the MSRV a consumer must have;
        # this is the toolchain we build with. Two numbers for two reasons — see AGENTS.md.
        #
        # Pinned rather than `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally. To
        # bump it, change it here and in `crates-io.yml` together, run clippy and fmt locally on that
        # same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit; the toolchain the tag used to encode
          # is an explicit — and, at this SHA, required — input.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `--locked` here, not on the four gate steps below: it makes a stale or hand-edited
      # `Cargo.lock` an obvious, named failure rather than something cargo silently repairs, while
      # the gate commands stay byte-identical to the ones in AGENTS.md § Build / test / run.
      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  console:
    name: console · test · build
    runs-on: ubuntu-latest
    # Its own job rather than a step bolted onto `check`. `console/` is a separate Node build that
    # does not participate in the Cargo workspace (AGENTS.md § Build / test / run): it needs Node and
    # not a Rust toolchain, it caches a different tree, and a failure here should fail under its own
    # name instead of inside the Rust gate. It is also the reason the two jobs run in parallel — a
    # broken console does not wait on a cargo build to say so.
    #
    # Until this job existed nothing outside a developer's machine ran `console/test/`, which
    # includes `components.test.mjs` — the guard that the 15 components shared with flux-connectors
    # import only Vue, a sibling component and `catalog.mts`. AGENTS.md § The console states that as
    # an invariant enforced by a test; nothing was running the test.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Node
        # Pinned for the same reason the Rust toolchain above is, and at the version and SHA
        # ../flux-connectors carries — a moving version turns someone else's release into our red
        # build. (Written without the literal step keyword so a "grep for an unpinned action" scan,
        # like ../flux's `check-action-pins.sh`, cannot match this comment.)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # `npm ci`, not the `npm install` of AGENTS.md's dev loop: `ci` installs exactly the committed
      # lockfile and fails when it and `package.json` disagree, instead of quietly resolving
      # something else. That is what makes the tree CI tests the tree the lockfile describes, and it
      # is the same choice — for the same reason — as both Node jobs in ../flux-connectors' ci.yml.
      - name: Install dependencies
        run: npm ci
        working-directory: console

      # Order is AGENTS.md's: test, then build. Unlike ../flux-connectors' `web` job — whose suite
      # asserts against the *rendered* site and so must run after the build — these tests read
      # `console/src` only and never `console/dist`, so they do not depend on a build having
      # happened. Verified on 2026-08-01 at 9ec774d: 18 tests across three files, green from a clean
      # `npm ci` with no `dist/` present.
      - name: Test
        run: npm test
        working-directory: console

      # A real gate, not a formality: `npm run build` is `vue-tsc --noEmit && vite build`, so it
      # type-checks every component and `.mts` module before bundling them.
      - name: Build
        run: npm run build
        working-directory: console
