version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      # connector-pack hands out Flux runtime traits. Moving either family alone can resolve two
      # incompatible traits with identical names, so the complete family is one update unit.
      flux-and-connectors:
        patterns:
          - "codewandler-flux-*"
          - "codewandler-connector-*"

  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
