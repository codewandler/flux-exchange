[workspace]
resolver = "2"
members = ["crates/exchange-host", "crates/exchange-server"]

[workspace.package]
version = "0.17.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/flux-exchange"
authors = ["codewandler"]

[workspace.dependencies]
# The crates.io package carries the `codewandler-` vanity prefix (matching the flux family); the
# alias key and the lib name stay bare, so `use exchange_host::…` is unaffected.
exchange-host = { path = "crates/exchange-host", package = "codewandler-flux-exchange-host", version = "0.17.0" }

async-trait = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
# `fs` is X-83's: the console is served by the host it talks to, because the session cookie is
# `SameSite=Strict` and a browser never attaches one cross-origin. See `routes::app_with_console`.
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }

# ---------------------------------------------------------------------------------------------
# The flux engine line. **This is the one place it is written down** (X-11).
#
# `ENGINE_LINE` below is the value; every `codewandler-flux-*` pin in this file must carry it, and
# `exchange-host`'s `tests/engine_line.rs` reads this file and refuses a second one. Bumping the
# engine is therefore editing this number and the pins beside it, in this file, and nothing else.
#
# **It is 0.54 because `connector-pack` 0.19.0 requires it** (X-101), and that ordering is the rule
# rather than a coincidence. A `0.x` requirement is `>=0.54.0, <0.55.0` to Cargo, so the line *is*
# the compatibility unit: `connector_pack::pack` hands out `Arc<dyn flux_runtime::Tool>`, and two
# `flux-runtime` versions in one graph are two distinct traits with identical names — Cargo resolves
# both happily and `rustc` rejects them somewhere else entirely. **The engine line is set by what
# `connector-pack` requires, never by what is newest.** It sat at 0.46 from X-11 until X-67 while
# 0.47 was already published, and it moved only when a `connector-pack` release asked for more.
#
# **The two pin sets move together, in one commit.** Raising `codewandler-flux-*` while
# `codewandler-connector-*` stays a line behind — or the reverse — is exactly what puts both lines
# in one lock. `exchange-host`'s `tests/engine_line.rs` holds that from three sides: one test
# *links* `connector_pack::pack` against `flux_web`'s tools so a divergence touching the seam is a
# compile error, one reads the pins below, and one reads `Cargo.lock` — because a manifest stating
# one line proves nothing about what **resolved**, and a transitive requirement a line behind is
# invisible here.
#
# ENGINE_LINE = "0.54"
#
# flux's vocabulary crate: the `Error` and `Result` every `Tool::execute` answers with. Its own
# dependencies remain pure data/error dependencies, which is why it is the one
# engine crate `exchange-host` may name without weakening lock 1 — telling a refusal that precedes
# dispatch from a transport failure means matching on that enum, and matching on it means naming it.
flux-app = { package = "codewandler-flux-app", version = "0.54" }
flux-channels = { package = "codewandler-flux-channels", version = "0.54" }
flux-core = { package = "codewandler-flux-core", version = "0.54" }
flux-events = { package = "codewandler-flux-events", version = "0.54" }
flux-flow = { package = "codewandler-flux-flow", version = "0.54" }
flux-lang = { package = "codewandler-flux-lang", version = "0.54" }
flux-provider = { package = "codewandler-flux-provider", version = "0.54" }
flux-runtime = { package = "codewandler-flux-runtime", version = "0.54" }
# Stable Flux contract vocabulary. Unlike the 0.54 engine crates this follows its own 1.x line;
# workflow execution names `IntentSet` only to implement the host-neutral interpreter port.
flux-spec = { package = "codewandler-flux-spec", version = "1.2.1" }
flux-secret = { package = "codewandler-flux-secret", version = "1.2.1" }
# flux's guarded-IO facade. Named here only because `flux_runtime::ToolContext::new` takes an
# `Arc<System>` and there is no other constructor — so a composition that wants to invoke an
# operation has to build one. It is **not** in `exchange-host`'s `[dependencies]`: it carries
# `flux_system::net`, which dials, and the crate that dispatches holds no transport (X-12, lock 1).
flux-system = { package = "codewandler-flux-system", version = "0.54" }
flux-web = { package = "codewandler-flux-web", version = "0.54" }
flux-tools = { package = "codewandler-flux-tools", version = "0.54" }

# The connector crates, all on the 0.19 line. `connector-catalog` has no dependencies at all and
# `connector-secrets` defaults to no features (its Vault client and reqwest sit behind `vault`).
#
# `connector-address` is the **address vocabulary**, and it replaces `connector-spec` here.
# That is a reorganisation rather than a rename (upstream C-407): `connector-spec` is the connector
# *compiler* — the IR, the OpenAPI ingest, the lockfile writer — and re-exporting a few hundred
# lines of addressing from it dragged that whole compiler onto crates.io permanently. The
# vocabulary moved down into a crate that depends on nothing but `thiserror`, and the edge
# inverted: `connector-spec` is now a consumer of it. This repository only ever wanted the
# vocabulary, so it names the vocabulary and no longer pulls a compiler it never called into.
#
# `connector-pack` is an ordinary `exchange-host` dependency: invocation and channel planning both
# end there, while the composing server owns the guarded transports and never names the pack.
connector-address = { package = "codewandler-connector-address", version = "0.19" }
connector-catalog = { package = "codewandler-connector-catalog", version = "0.19" }
connector-pack = { package = "codewandler-connector-pack", version = "0.19" }
connector-secrets = { package = "codewandler-connector-secrets", version = "0.19" }
# The OIDC token exchange, opened up by the X-04 dependency decision (2026-08-01). The family
# precedent is sibling flux-connectors, which already uses reqwest and jsonwebtoken for exactly this
# exchange; the alternative was hand-rolling signature verification, which nobody should do.
#
# `rustls-tls` and `default-features = false` keep OpenSSL out of the build, so the binary does not
# acquire a C toolchain dependency for one HTTPS call. `jsonwebtoken` picks the pure-Rust backend for
# the same reason.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
# TLS: `rustls`, so OpenSSL is genuinely absent and there is only one TLS stack in the tree.
#
# It does NOT make this build C-free, and an earlier version of this comment wrongly said it did.
# reqwest's `rustls` feature resolves to `__rustls-aws-lc-rs`, so `aws-lc-rs` / `aws-lc-sys` — C and
# assembly — are compiled. **A container with no C toolchain that built this repository before will
# now fail.** Recorded here because that is a deployment fact, not a preference.
#
# Trust anchors come from `rustls_platform_verifier`, which the `rustls` feature pulls in
# unconditionally and which defers to the OS trust store — so a corporate IdP behind a private CA
# works. `rustls-native-certs` is listed for intent only; reqwest 0.13 references it nowhere.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
    "http2",
    "charset",
] }
# Keep Exchange on Flux 0.54's Rust-1.88-compatible SQLite line. A second libsqlite3-sys line is
# rejected by Cargo anyway, and 0.40's build script requires syntax newer than our declared MSRV.
rusqlite = { version = "0.39", features = ["bundled"] }
# Replaces the hand-written `oidc/sha256.rs`, which existed only because no digest crate was allowed
# in. It was checked exhaustively against hashlib before it was trusted; it is deleted now rather
# than kept as a second implementation nobody exercises.
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
tokio-tungstenite = "0.30"
